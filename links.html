:root{

}
[data-theme="dark"]{

  --ink:#F6F1E6;
  --muted:#9A9590;
  --line:#F6F1E6;
  --line-faint:rgba(246,241,230,0.14);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding:32px 16px;
  min-height:100vh;
}
.card{
  width:100%; max-width:420px;
  background:var(--paper);
  border:1.25px solid var(--line);
  padding:32px 28px 28px;
  text-align:center;
}
.logo{
  width:56px; height:auto; display:block; margin:0 auto 16px;
}
h1{
  font-family:var(--display); font-weight:700;
  font-size:1.35rem; letter-spacing:-0.02em; margin-bottom:4px;
}
.sub{
  font-size:0.72rem; color:var(--muted); letter-spacing:0.06em; margin-bottom:24px;
}
.links{display:flex; flex-direction:column; gap:10px}
.links a{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 16px; border:1.25px solid var(--line);
  background:var(--paper); color:var(--ink);
  text-decoration:none; font-family:var(--display); font-weight:600; font-size:0.88rem;
  letter-spacing:-0.01em; transition:all .18s cubic-bezier(0.16,1,0.3,1);
}
.links a:hover{background:var(--ink); color:var(--paper); border-color:var(--ink); transform:translateY(-1px)}
.links a.accent{background:var(--accent); border-color:var(--accent); color:white}
.links a.accent:hover{background:var(--ink); border-color:var(--ink)}
.links a svg{width:16px; height:16px; flex-shrink:0}
.note{margin-top:18px; font-size:0.6rem; color:var(--muted); letter-spacing:0.06em}
.note a{color:var(--muted); text-decoration:underline; text-underline-offset:2px}
.note a:hover{color:var(--ink)}
.theme{
  margin-top:16px; background:transparent; border:1px solid var(--line-faint);
  color:var(--muted); font-family:var(--mono); font-size:0.58rem; letter-spacing:0.08em;
  padding:6px 10px; cursor:pointer;
}
.theme:hover{border-color:var(--line); color:var(--ink)}
</style>
<script>(function(){var dark=window.matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.setAttribute('data-theme', dark?'dark':'light');})();</script>
</head>

<script>
(function(){
  const root = document.documentElement;
  const logo = document.getElementById('card-logo');
  const fav = document.getElementById('favicon');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  function apply(t){
    root.setAttribute('data-theme', t);
    if(logo) logo.src = 'img/svg/CJA_logo_AB21_' + (t==='dark'?'white':'black') + '.svg';
    if(fav) fav.href = 'img/favicon/' + (t==='dark'?'Dark':'Light') + 'ModeFavicon.svg';
  }
  apply(systemDark.matches ? 'dark' : 'light');
  systemDark.addEventListener('change', e=> apply(e.matches ? 'dark' : 'light'));
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    const cur = root.getAttribute('data-theme') || (systemDark.matches ? 'dark' : 'light');
    const next = cur==='dark'?'light':'dark';
    apply(next);
  });
})();
</script>
