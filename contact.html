<!DOCTYPE html>
<html lang="en" class="loader-loading">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Christian Alvarez</title>
<meta name="description" content="Contact card for Christian Alvarez. Copy email or save contact.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" href="img/fav/CJA_logo_adaptive.svg">
<link rel="icon" type="image/svg+xml" href="img/fav/CJA_logo_adaptive.svg">
<link rel="apple-touch-icon" href="img/fav/CJA_logo_adaptive.svg">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#111110">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F1E6">
<style>
:root{
  --paper:#F6F1E6;
  --paper-2:#FFFCF3;
  --ink:#111110;
  --muted:#8E897E;
  --line:#111110;
  --line-faint:rgba(17,17,16,0.12);
  --accent:#2D6A4F;
  --mono:'JetBrains Mono', monospace;
  --display:'Space Grotesk', sans-serif;
}
[data-theme="dark"]{
  --paper:#111110;
  --paper-2:#1A1917;
  --ink:#F6F1E6;
  --muted:#9A9590;
  --line:#F6F1E6;
  --line-faint:rgba(246,241,230,0.14);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding:32px 16px;
  min-height:100vh;
}
.card{
  width:100%; max-width:420px;
  background:var(--paper);
  border:1.25px solid var(--line);
  padding:32px 28px 28px;
  text-align:center;
}
.logo-wrap{
  display:block; width:fit-content; margin:0 auto 16px;
  transition:transform .18s ease-out; will-change:transform;
}
.logo{
  width:56px; height:auto; display:block; margin:0;
  transform-origin:50% 60%;
  animation:logoFloat 5.5s ease-in-out infinite;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-4px) rotate(-1.5deg)}
}
.logo-wrap:hover .logo{animation:logoWiggle .5s ease}
@keyframes logoWiggle{
  0%{transform:rotate(0)}
  30%{transform:rotate(3deg) translateY(-2px)}
  60%{transform:rotate(-2deg)}
  100%{transform:rotate(0)}
}
.card{animation:cardIn .45s cubic-bezier(0.16,1,0.3,1)}
@keyframes cardIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
.email-box{opacity:0; animation:entryIn .4s cubic-bezier(0.16,1,0.3,1) both; animation-delay:.05s}
.links a, .links button.link-btn{opacity:0; animation:entryIn .4s cubic-bezier(0.16,1,0.3,1) both}
.links a:nth-child(1), .links button.link-btn:nth-child(1){animation-delay:.1s}
.links a:nth-child(2), .links button.link-btn:nth-child(2){animation-delay:.15s}
@keyframes entryIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  .logo, .card, .email-box, .links a, .links button.link-btn{animation:none}
  .email-box, .links a, .links button.link-btn{opacity:1}
  .logo-wrap{transition:none}
}
h1{font-family:var(--display); font-weight:700; font-size:1.35rem; letter-spacing:-0.02em; margin-bottom:4px}
.role{font-size:0.72rem; color:var(--muted); letter-spacing:0.02em; line-height:1.5; margin-bottom:4px}
.sub{font-size:0.72rem; color:var(--muted); letter-spacing:0.06em; margin-bottom:24px}
.email-box{
  display:flex; align-items:center; gap:8px;
  border:1.25px solid var(--line);
  background:var(--paper-2);
  padding:8px 8px 8px 14px;
  margin-bottom:10px;
  text-align:left;
}
.email-box span{
  flex:1; min-width:0;
  font-size:0.72rem; font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.email-box button{
  flex-shrink:0;
  font-family:var(--display); font-weight:600; font-size:0.78rem;
  padding:8px 14px; cursor:pointer;
  background:var(--ink); color:var(--paper); border:1.25px solid var(--ink);
}
.email-box button:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.copied{font-size:0.62rem; color:var(--accent); letter-spacing:0.06em; min-height:1em; margin-bottom:12px}
.links{display:flex; flex-direction:column; gap:10px}
.links a, .links button.link-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 16px; border:1.25px solid var(--line);
  background:var(--paper); color:var(--ink);
  text-decoration:none; font-family:var(--display); font-weight:600; font-size:0.88rem;
  letter-spacing:-0.01em; transition:all .18s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer; width:100%;
  position:relative; overflow:hidden;
}
.links a::before, .links button.link-btn::before{
  content:''; position:absolute; top:0; bottom:0; left:0; width:0;
  background:var(--ink); z-index:-1;
  transition:width .25s cubic-bezier(0.16,1,0.3,1);
}
.links a:hover, .links button.link-btn:hover{color:var(--paper); border-color:var(--ink); transform:translateY(-1px)}
.links a:hover::before, .links button.link-btn:hover::before{width:100%}
.links a svg, .links button.link-btn svg{width:16px; height:16px; flex-shrink:0; transition:transform .18s cubic-bezier(0.16,1,0.3,1)}
.links a:hover svg, .links button.link-btn:hover svg{transform:translateX(3px)}
.links a.accent{background:var(--accent); border-color:var(--accent); color:white}
.links a.accent::before{background:rgba(255,255,255,0.28)}
.links a.accent:hover{border-color:var(--accent) !important; color:white !important}
.links a.accent:hover::before{width:100%}
.links a.ghost, .links button.link-btn.ghost{background:transparent}
.back{margin-top:18px; font-size:0.62rem; letter-spacing:0.06em}
.back a{color:var(--muted); text-decoration:underline; text-underline-offset:2px}
.back a:hover{color:var(--ink)}
.theme{
  margin-top:16px; background:transparent; border:1px solid var(--line-faint);
  color:var(--muted); font-family:var(--mono); font-size:0.58rem; letter-spacing:0.08em;
  padding:6px 10px; cursor:pointer;
}
.theme:hover{border-color:var(--line); color:var(--ink)}
</style>
<script>(function(){var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');var f=document.getElementById('favicon');if(f)f.href='img/fav/CJA_logo_adaptive.svg';}());</script>
</head>
<body>
<div class="card">
  <div class="logo-wrap" id="logoWrap">
    <img id="card-logo" src="img/svg/CJA_logo_adaptive.svg" alt="Christian Alvarez logo" class="logo" width="56" height="72">
  </div>
  <h1>Christian Alvarez</h1>
  <div class="role">IT · Design · Illustration</div>
  <div class="sub">Chicago, IL · Remote available</div>

  <div class="email-box">
    <span id="emailText">alvarez.christian46@outlook.com</span>
    <button id="copyBtn" type="button">Copy</button>
  </div>
  <div class="copied" id="copiedMsg" aria-live="polite"></div>

  <div class="links">
    <a href="mailto:alvarez.christian46@outlook.com" class="accent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      Email me
    </a>
    <button class="link-btn ghost" id="vcardBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8"/><path d="M8 14h5"/></svg>
      Save contact (.vcf)
    </button>
  </div>

  <div class="back"><a href="links.html">← Back to links</a></div>
  <button class="theme" id="themeBtn" aria-label="Switch theme">Toggle theme</button>
</div>
<script src="js/loader.js" defer></script>
<script>
(function(){
  var EMAIL = 'alvarez.christian46@outlook.com';

  function init(){
    var root = document.documentElement;
    var logo = document.getElementById('card-logo');
    var fav = document.getElementById('favicon');
    var systemDark = window.matchMedia('(prefers-color-scheme: dark)');
    function apply(t){
      root.setAttribute('data-theme', t);
      if(logo) logo.src = 'img/svg/CJA_logo_AB21_' + (t==='dark'?'white':'black') + '.svg';
      if(fav) fav.href = 'img/fav/CJA_logo_AB21_' + (t==='dark'?'white':'black') + '.svg';
    }
    apply(systemDark.matches ? 'dark' : 'light');
    systemDark.addEventListener('change', function(e){ apply(e.matches ? 'dark' : 'light'); });
    document.getElementById('themeBtn').addEventListener('click', function(){
      var cur = root.getAttribute('data-theme') || (systemDark.matches ? 'dark' : 'light');
      apply(cur==='dark'?'light':'dark');
    });

    var wrap = document.getElementById('logoWrap');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var coarsePointer = window.matchMedia('(hover: none)');
    if(wrap && !reduceMotion.matches && !coarsePointer.matches){
      var raf = null, tx = 0, ty = 0;
      window.addEventListener('mousemove', function(e){
        var nx = (e.clientX / window.innerWidth - 0.5) * 10;
        var ny = (e.clientY / window.innerHeight - 0.5) * 10;
        tx = Math.max(-5, Math.min(5, nx));
        ty = Math.max(-5, Math.min(5, ny));
        if(!raf){
          raf = requestAnimationFrame(function(){
            wrap.style.transform = 'translate(' + tx + 'px, ' + ty + 'px)';
            raf = null;
          });
        }
      });
      document.addEventListener('mouseleave', function(){
        wrap.style.transform = 'translate(0,0)';
      });
    }

    var copyBtn = document.getElementById('copyBtn');
    var msg = document.getElementById('copiedMsg');
    function flash(text){
      msg.textContent = text;
      setTimeout(function(){ msg.textContent=''; }, 2000);
    }
    copyBtn.addEventListener('click', function(){
      function done(){ copyBtn.textContent='Copied'; flash('Email copied to clipboard'); setTimeout(function(){ copyBtn.textContent='Copy'; }, 2000); }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(EMAIL).then(done).catch(function(){ fallback(); });
      } else fallback();
      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = EMAIL; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); done(); } catch(e){ flash(EMAIL); }
        document.body.removeChild(ta);
      }
    });

    document.getElementById('vcardBtn').addEventListener('click', function(){
      var vcf = ['BEGIN:VCARD','VERSION:3.0','FN:Christian Alvarez','N:Alvarez;Christian;;;','EMAIL;TYPE=INTERNET,PREF:'+EMAIL,'ADR;TYPE=HOME:;;;Chicago;IL;;USA','URL:https://ctrluserknown.github.io/website-ctrluserknown/','NOTE:IT - Design - Illustration. Open to internships and junior roles.','END:VCARD'].join('\r\n');
      var blob = new Blob([vcf], {type:'text/vcard'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'christian-alvarez.vcf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    });
  }
  if(window._cjaLoaderReady) window._cjaLoaderReady(init);
  else if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
